name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up JDK 21 (same as F-Droid)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build unsigned release APK (same task as F-Droid)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDirectRelease

      - name: Save the unsigned APK for comparison with F-Droid
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/direct/release/*.apk
          retention-days: 30

      - name: Sign the APK with your key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          INPUT_APK="$(find app/build/outputs/apk/direct/release -name '*.apk' | head -1)"
          echo "Signing: $INPUT_APK"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --alignment-preserved true \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out app-release.apk \
            "$INPUT_APK"
          "$APKSIGNER" verify --print-certs app-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Attach app-release.apk to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
